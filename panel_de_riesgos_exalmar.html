            // --- INICIO CONTEXTO SIMULACION ---
            const { createContext, useContext, useEffect } = React;
            const INITIAL_STATE = {
                deuda: 300000,
                patrimonio: 317089,
                ebitda: 100000,
                gastosFinancieros: 27807,
                tasaImpuesto: 0.295,
                kd: 0.0926,
                ke: 0.124,
            };
            const SimulationContext = createContext();
            const useSimulation = () => useContext(SimulationContext);
            
            const SimulationProvider = ({ children }) => {
                const [financialData, setFinancialData] = useState(INITIAL_STATE);
                const [metrics, setMetrics] = useState({
                    wacc: 0, ratioDeudaPatrimonio: 0, coberturaIntereses: 0, pesoDeuda: 0, pesoPatrimonio: 0, costoDeudaDespuesImpuestos: 0
                });

                const calculateMetrics = (data) => {
                    const { deuda, patrimonio, ebitda, gastosFinancieros, tasaImpuesto, kd, ke } = data;
                    const valorTotal = deuda + patrimonio;
                    const pesoDeuda = deuda / valorTotal;
                    const pesoPatrimonio = patrimonio / valorTotal;
                    const costoDeudaDespuesImpuestos = kd * (1 - tasaImpuesto);
                    const wacc = (pesoDeuda * costoDeudaDespuesImpuestos) + (pesoPatrimonio * ke);
                    const ratioDeudaPatrimonio = deuda / patrimonio;
                    const coberturaIntereses = gastosFinancieros > 0 ? (ebitda / gastosFinancieros) : 0;
                    setMetrics({ wacc, ratioDeudaPatrimonio, coberturaIntereses, pesoDeuda, pesoPatrimonio, costoDeudaDespuesImpuestos });
                };

                useEffect(() => { calculateMetrics(financialData); }, [financialData]);
                const updateSimulation = (updates) => { setFinancialData(prev => ({ ...prev, ...updates })); };
                const resetSimulation = () => { setFinancialData(INITIAL_STATE); };

                return (
                    <SimulationContext.Provider value={{ financialData, metrics, updateSimulation, resetSimulation }}>
                        {children}
                    </SimulationContext.Provider>
                );
            };

const SimuladorBonosView = () => {
    const { financialData, metrics, updateSimulation } = useSimulation();

    // Valores interactivos (en millones de dólares y porcentajes)
    const [montoEmisionM, setMontoEmisionM] = useState(100); // 100 Millones
    const [tasaCupon, setTasaCupon] = useState(8.5); // 8.5%
    const [plazo, setPlazo] = useState(7); // 7 años

    // Estado simulado local
    const [simulatedMetrics, setSimulatedMetrics] = useState({ ...metrics });
    const [simulatedData, setSimulatedData] = useState({ ...financialData });

    // Recalcular estado simulado cada vez que cambia el slider o el financialData base
    useEffect(() => {
        // El monto de emisión se ingresa en millones, pero la data está en miles (x1000)
        const montoEmisionMiles = montoEmisionM * 1000;
        
        // Nueva deuda: Deuda actual + nueva emisión
        const nuevaDeuda = financialData.deuda + montoEmisionMiles;
        
        // Nuevos gastos: Gastos actuales + (nueva emisión * tasa cupón)
        // La tasa cupón viene en porcentaje (ej 8.5) -> / 100
        const nuevoGastoEmision = montoEmisionMiles * (tasaCupon / 100);
        const nuevosGastosFinancieros = financialData.gastosFinancieros + nuevoGastoEmision;
        
        // Nuevo Kd global = Gastos totales / Deuda total
        const nuevoKd = nuevosGastosFinancieros / nuevaDeuda;

        // Nuevos cálculos derivados
        const valorTotal = nuevaDeuda + financialData.patrimonio;
        const pesoDeuda = nuevaDeuda / valorTotal;
        const pesoPatrimonio = financialData.patrimonio / valorTotal;
        
        const costoDeudaDespuesImpuestos = nuevoKd * (1 - financialData.tasaImpuesto);
        const wacc = (pesoDeuda * costoDeudaDespuesImpuestos) + (pesoPatrimonio * financialData.ke);
        
        const ratioDeudaPatrimonio = nuevaDeuda / financialData.patrimonio;
        const coberturaIntereses = nuevosGastosFinancieros > 0 ? (financialData.ebitda / nuevosGastosFinancieros) : 0;

        setSimulatedData({
            ...financialData,
            deuda: nuevaDeuda,
            gastosFinancieros: nuevosGastosFinancieros,
            kd: nuevoKd
        });

        setSimulatedMetrics({
            wacc,
            ratioDeudaPatrimonio,
            coberturaIntereses,
            pesoDeuda,
            pesoPatrimonio,
            costoDeudaDespuesImpuestos
        });
    }, [montoEmisionM, tasaCupon, plazo, financialData]);

    const formatNumber = (val) => new Intl.NumberFormat('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(val);
    const formatPercent = (val) => `${(val * 100).toFixed(2)}%`;

    const handleApplySimulation = () => {
        updateSimulation({
            deuda: simulatedData.deuda,
            gastosFinancieros: simulatedData.gastosFinancieros,
            kd: simulatedData.kd
        });
        alert('¡Simulación aplicada con éxito! El estado global (WACC) ha sido actualizado.');
    };

    return (
        <div className="flex flex-col h-full w-full bg-exalmar-light rounded-2xl p-6 shadow-inner overflow-y-auto animate-fade-in-up">
            <div className="mb-6">
                <h3 className="text-3xl font-black text-exalmar-blue tracking-tight uppercase">Simulador de Emisión de Bonos</h3>
                <p className="text-gray-500 mt-1 font-medium">Laboratorio de pruebas: Analiza el impacto de emitir nueva deuda en el mercado de capitales (en US$).</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
                
                {/* Panel de Controles (Sliders) */}
                <div className="lg:col-span-4 bg-white rounded-2xl shadow-lg p-6 border-t-4 border-exalmar-blue flex flex-col gap-6">
                    <h4 className="text-gray-700 font-bold uppercase tracking-widest text-sm mb-2 flex items-center gap-2">
                        <i className="ph ph-sliders text-exalmar-blue text-lg"></i>
                        Parámetros del Bono
                    </h4>
                    
                    {/* Monto Slider */}
                    <div className="flex flex-col gap-2">
                        <div className="flex justify-between items-end">
                            <label className="text-sm font-bold text-gray-600">Monto de Emisión (US$)</label>
                            <span className="text-lg font-black text-exalmar-blue">{montoEmisionM}M</span>
                        </div>
                        <input 
                            type="range" min="0" max="250" step="10"
                            value={montoEmisionM}
                            onChange={(e) => setMontoEmisionM(Number(e.target.value))}
                            className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-exalmar-blue"
                        />
                        <div className="flex justify-between text-xs text-gray-400 font-medium">
                            <span>0M</span>
                            <span>250M</span>
                        </div>
                    </div>

                    {/* Tasa Cupón Slider */}
                    <div className="flex flex-col gap-2">
                        <div className="flex justify-between items-end">
                            <label className="text-sm font-bold text-gray-600">Tasa Cupón Anual</label>
                            <span className="text-lg font-black text-orange-500">{tasaCupon.toFixed(1)}%</span>
                        </div>
                        <input 
                            type="range" min="4" max="15" step="0.1"
                            value={tasaCupon}
                            onChange={(e) => setTasaCupon(Number(e.target.value))}
                            className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-orange-500"
                        />
                        <div className="flex justify-between text-xs text-gray-400 font-medium">
                            <span>4.0%</span>
                            <span>15.0%</span>
                        </div>
                    </div>

                    {/* Plazo Slider */}
                    <div className="flex flex-col gap-2">
                        <div className="flex justify-between items-end">

                            <span>15 años</span>
                        </div>
                    </div>

                    <button 
                        onClick={handleApplySimulation}
                        className="mt-auto bg-exalmar-blue hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-colors flex items-center justify-center gap-2"
                    >
                        <i className="ph ph-check-circle text-xl"></i>
                        Aplicar Emisión al WACC
                    </button>
                </div>

                {/* Panel de Impacto (Comparativa) */}
                <div className="lg:col-span-8 bg-white rounded-2xl shadow-lg p-6 border-t-4 border-gray-300">
                    <h4 className="text-gray-700 font-bold uppercase tracking-widest text-sm mb-6 flex items-center gap-2">
                        <i className="ph ph-scales text-gray-500 text-lg"></i>
                        Impacto Financiero (Actual vs Simulado)
                    </h4>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        
                        {/* WACC */}
                        <div className="bg-gray-50 rounded-xl p-4 border border-gray-100 flex flex-col justify-between">
                            <span className="text-sm font-bold text-gray-500 mb-2">Costo Promedio Ponderado (WACC)</span>
                            <div className="flex items-center justify-between">
                                <div className="text-gray-400">
                                    <div className="text-xs">Actual</div>
                                    <div className="text-xl font-bold">{formatPercent(metrics.wacc)}</div>
                                </div>
                                <i className="ph ph-arrow-right text-gray-300 text-xl"></i>
                                <div className={simulatedMetrics.wacc > metrics.wacc ? 'text-red-500' : 'text-exalmar-green'}>
                                    <div className="text-xs font-bold text-gray-500">Simulado</div>
                                    <div className="text-2xl font-black">{formatPercent(simulatedMetrics.wacc)}</div>
                                </div>
                            </div>
                        </div>

                        {/* Deuda Total */}
                        <div className="bg-gray-50 rounded-xl p-4 border border-gray-100 flex flex-col justify-between">
                            <span className="text-sm font-bold text-gray-500 mb-2">Deuda Total (Miles US$)</span>
                            <div className="flex items-center justify-between">
                                <div className="text-gray-400">
                                    <div className="text-xs">Actual</div>
                                    <div className="text-xl font-bold">${formatNumber(financialData.deuda)}</div>
                                </div>
                                <i className="ph ph-arrow-right text-gray-300 text-xl"></i>
                                <div className="text-orange-500">
                                    <div className="text-xs font-bold text-gray-500">Simulado</div>
                                    <div className="text-2xl font-black">${formatNumber(simulatedData.deuda)}</div>
                                </div>
                            </div>
                        </div>

                        {/* Cobertura de Intereses */}
                        <div className="bg-gray-50 rounded-xl p-4 border border-gray-100 flex flex-col justify-between">
                            <span className="text-sm font-bold text-gray-500 mb-2">Cobertura de Intereses (EBITDA / Gastos)</span>
                            <div className="flex items-center justify-between">
                                <div className="text-gray-400">
                                    <div className="text-xs">Actual</div>
                                    <div className="text-xl font-bold">{formatNumber(metrics.coberturaIntereses)}x</div>
                                </div>
                                <i className="ph ph-arrow-right text-gray-300 text-xl"></i>
                                <div className={simulatedMetrics.coberturaIntereses < metrics.coberturaIntereses ? 'text-red-500' : 'text-exalmar-green'}>
                                    <div className="text-xs font-bold text-gray-500">Simulado</div>
                                    <div className="text-2xl font-black">{formatNumber(simulatedMetrics.coberturaIntereses)}x</div>
                                </div>
                            </div>
                        </div>

                        {/* Ratio Deuda / Patrimonio */}
                        <div className="bg-gray-50 rounded-xl p-4 border border-gray-100 flex flex-col justify-between">
                            <span className="text-sm font-bold text-gray-500 mb-2">Ratio Deuda / Patrimonio</span>
                            <div className="flex items-center justify-between">
                                <div className="text-gray-400">
                                    <div className="text-xs">Actual</div>
                                    <div className="text-xl font-bold">{formatNumber(metrics.ratioDeudaPatrimonio)}x</div>
                                </div>
                                <i className="ph ph-arrow-right text-gray-300 text-xl"></i>
                                <div className={simulatedMetrics.ratioDeudaPatrimonio > metrics.ratioDeudaPatrimonio ? 'text-red-500' : 'text-exalmar-green'}>
                                    <div className="text-xs font-bold text-gray-500">Simulado</div>
                                    <div className="text-2xl font-black">{formatNumber(simulatedMetrics.ratioDeudaPatrimonio)}x</div>
                                </div>
                            </div>
                        </div>

                    </div>
                    
                    {/* Explicación Dinámica */}
                    <div className="mt-6 p-4 rounded-xl bg-blue-50/50 border border-blue-100 flex gap-4">
                        <i className="ph ph-info text-2xl text-exalmar-blue mt-1"></i>
                        <p className="text-sm text-gray-600 leading-relaxed">
                            Emitir <strong>US$ {montoEmisionM}M</strong> en bonos a una tasa del <strong>{tasaCupon}%</strong> incrementará la deuda total a <strong>US$ {formatNumber(simulatedData.deuda / 1000)}M</strong>. Esto elevará los gastos financieros anuales, reduciendo la cobertura de intereses de <strong>{formatNumber(metrics.coberturaIntereses)}x</strong> a <strong>{formatNumber(simulatedMetrics.coberturaIntereses)}x</strong>. {simulatedMetrics.ratioDeudaPatrimonio > 1.5 && <span className="text-red-600 font-bold">Atención: El ratio Deuda/Patrimonio supera el nivel conservador de 1.5x, elevando el riesgo financiero.</span>}
                        </p>
                    </div>

                </div>
            </div>
        </div>
    );
};

const SimuladorAccionesView = () => {
    const { financialData, metrics, updateSimulation } = useSimulation();

    // Valores interactivos
    const [nuevasAccionesM, setNuevasAccionesM] = useState(20); // 20 Millones
    const [precioAccion, setPrecioAccion] = useState(0.50); // US$ 0.50

    // Constantes
    const ACCIONES_BASE_M = 295.5; // Millones de acciones actuales
    
    // Estado simulado local
    const [simulatedMetrics, setSimulatedMetrics] = useState({ ...metrics, roe: 0 });
    const [simulatedData, setSimulatedData] = useState({ ...financialData });
    const [metricasBase, setMetricasBase] = useState({ roe: 0, utilidadNeta: 0 });

    // Recalcular estado simulado cada vez que cambia el slider o el financialData base
    useEffect(() => {
        // Cálculo de Utilidad Neta Base (Asumiendo Utilidad = (EBITDA - Gastos) * (1 - T))
        const utilidadNetaBase = (financialData.ebitda - financialData.gastosFinancieros) * (1 - financialData.tasaImpuesto);
        const roeActual = utilidadNetaBase / financialData.patrimonio;

        setMetricasBase({
            roe: roeActual,
            utilidadNeta: utilidadNetaBase
        });

        // Simulación
        // Monto recaudado en miles de dólares
        const montoRecaudadoMiles = (nuevasAccionesM * 1000000 * precioAccion) / 1000;
        
        // Nuevo Patrimonio: Patrimonio actual + Monto recaudado
        const nuevoPatrimonio = financialData.patrimonio + montoRecaudadoMiles;
        
        // Nuevo ROE (Asumiendo que la Utilidad Neta se mantiene constante a corto plazo)
        const nuevoRoe = utilidadNetaBase / nuevoPatrimonio;

        // Nuevos cálculos derivados (WACC, Ratio Deuda/Patrimonio)
        const valorTotal = financialData.deuda + nuevoPatrimonio;
        const pesoDeuda = financialData.deuda / valorTotal;
        const pesoPatrimonio = nuevoPatrimonio / valorTotal;
        
        const costoDeudaDespuesImpuestos = financialData.kd * (1 - financialData.tasaImpuesto);
        const wacc = (pesoDeuda * costoDeudaDespuesImpuestos) + (pesoPatrimonio * financialData.ke);
        
        const ratioDeudaPatrimonio = financialData.deuda / nuevoPatrimonio;

        setSimulatedData({
            ...financialData,
            patrimonio: nuevoPatrimonio
        });

        setSimulatedMetrics({
            ...metrics,
            wacc,
            ratioDeudaPatrimonio,
            pesoDeuda,
            pesoPatrimonio,
            roe: nuevoRoe
        });
    }, [nuevasAccionesM, precioAccion, financialData, metrics]);

    const formatNumber = (val) => new Intl.NumberFormat('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(val);
    const formatPercent = (val) => `${(val * 100).toFixed(2)}%`;

    const handleApplySimulation = () => {
        updateSimulation({
            patrimonio: simulatedData.patrimonio
        });
        alert('¡Simulación de Acciones aplicada con éxito! El estado global (WACC) ha sido actualizado.');
    };

    const porcentajeDilucion = (nuevasAccionesM / (ACCIONES_BASE_M + nuevasAccionesM)) * 100;

    return (
        <div className="flex flex-col h-full w-full bg-exalmar-light rounded-2xl p-6 shadow-inner overflow-y-auto animate-fade-in-up">
            <div className="mb-6">
                <h3 className="text-3xl font-black text-exalmar-blue tracking-tight uppercase">Simulador de Emisión de Acciones</h3>
                <p className="text-gray-500 mt-1 font-medium">Laboratorio de pruebas: Analiza el impacto de levantar capital patrimonial y la dilución del ROE.</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
                
                {/* Panel de Controles (Sliders) */}
                <div className="lg:col-span-4 bg-white rounded-2xl shadow-lg p-6 border-t-4 border-[#8b5cf6] flex flex-col gap-6">

                    </h4>

                            <label className="text-sm font-bold text-gray-600">Nuevas Acciones (Millones)</label>
                            <span className="text-lg font-black text-[#8b5cf6]">{nuevasAccionesM}M</span>
                        </div>

                            type="range" min="0" max="100" step="1"
                            value={nuevasAccionesM}
                            onChange={(e) => setNuevasAccionesM(Number(e.target.value))}
                            className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-[#8b5cf6]"
                        />

                                    <div className="text-xl font-bold">{formatPercent(metrics.wacc)}</div>

                                <i className="ph ph-arrow-right text-gray-300 text-xl"></i>
                                <div className={simulatedMetrics.wacc > metrics.wacc ? 'text-red-500' : 'text-exalmar-green'}>
                                    <div className="text-xs font-bold text-gray-500">Simulado</div>
                                    <div className="text-2xl font-black">{formatPercent(simulatedMetrics.wacc)}</div>
                                </div>
                            </div>

const EstrategiaFinanciamientoView = () => {
    const { financialData, metrics } = useSimulation();

    // TABS: 'motor', 'ranking', 'matriz'
    const [activeTab, setActiveTab] = useState('motor');

    // Inputs del Usuario
    const [montoRequerido, setMontoRequerido] = useState(100); // en Millones
    const [toleranciaRiesgo, setToleranciaRiesgo] = useState('moderado'); // conservador, moderado, agresivo
    const [horizonte, setHorizonte] = useState('largo'); // corto, mediano, largo

    // Tasas base
    const [tasaBancaria, setTasaBancaria] = useState(4.25); // BCR = 4.25%
    const [tasaBonos, setTasaBonos] = useState(8.5);
    const [costoCapital, setCostoCapital] = useState(12.4);

    // Estado de los 4 escenarios simulados
    const [escenarios, setEscenarios] = useState([]);
    const [recomendacion, setRecomendacion] = useState(null);

    // Cálculos matemáticos
    useEffect(() => {
        const montoMiles = montoRequerido * 1000;
        const utilidadNetaActual = (financialData.ebitda - financialData.gastosFinancieros) * (1 - financialData.tasaImpuesto);

        const calcularEscenario = (nombre, pctDeuda, pctPatrimonio, tasaD) => {
            const nuevaDeuda = financialData.deuda + (montoMiles * pctDeuda);
            const nuevoPatrimonio = financialData.patrimonio + (montoMiles * pctPatrimonio);
            
            const nuevosGastos = financialData.gastosFinancieros + ((montoMiles * pctDeuda) * (tasaD / 100));
            // Asumimos utilidad neta constante operativa (solo cambia por los nuevos gastos financieros)
            const nuevaUtilidadNeta = (financialData.ebitda - nuevosGastos) * (1 - financialData.tasaImpuesto);
            
            const nuevoRoe = nuevaUtilidadNeta / nuevoPatrimonio;
            const nuevoRiesgo = nuevaDeuda / nuevoPatrimonio; // Ratio D/E
            const nuevaCobertura = nuevosGastos > 0 ? (financialData.ebitda / nuevosGastos) : 0;

            const valorTotal = nuevaDeuda + nuevoPatrimonio;
            const pesoD = nuevaDeuda / valorTotal;
            const pesoP = nuevoPatrimonio / valorTotal;
            
            // Calculamos Kd ponderado (deuda antigua + deuda nueva)
            const nuevoKd = nuevosGastos / nuevaDeuda;
            const kdDespuesImpuestos = nuevoKd * (1 - financialData.tasaImpuesto);
            const nuevoWacc = (pesoD * kdDespuesImpuestos) + (pesoP * (costoCapital / 100));

            return {
                id: nombre.toLowerCase().replace(' ', '-'),
                nombre,
                roe: nuevoRoe,
                riesgo: nuevoRiesgo,
                cobertura: nuevaCobertura,
                wacc: nuevoWacc,
                gastos: nuevosGastos
            };
        };

        const escBancario = calcularEscenario('Crédito Bancario', 1, 0, tasaBancaria);
        const escBonos = calcularEscenario('Bono Corporativo', 1, 0, tasaBonos);
        const escAcciones = calcularEscenario('Emisión de Acciones', 0, 1, 0); // No hay tasa D
        const escMixto = calcularEscenario('Financiamiento Mixto (70/30)', 0.7, 0.3, tasaBonos);

        const arrEscenarios = [escBancario, escBonos, escAcciones, escMixto];

        // Normalización para Scoring (Min-Max scaling inverso para los que "menor es mejor")
        const maxRoe = Math.max(...arrEscenarios.map(e => e.roe));
        const minRoe = Math.min(...arrEscenarios.map(e => e.roe));
        
        const maxRiesgo = Math.max(...arrEscenarios.map(e => e.riesgo));
        const minRiesgo = Math.min(...arrEscenarios.map(e => e.riesgo));

        const maxWacc = Math.max(...arrEscenarios.map(e => e.wacc));
        const minWacc = Math.min(...arrEscenarios.map(e => e.wacc));

        // Pesos según Tolerancia
        let pesoRoe, pesoRiesgo, pesoWacc;
        if (toleranciaRiesgo === 'conservador') {
            pesoRiesgo = 0.6; pesoWacc = 0.3; pesoRoe = 0.1;
        } else if (toleranciaRiesgo === 'agresivo') {
            pesoRiesgo = 0.1; pesoWacc = 0.3; pesoRoe = 0.6;
        } else {
            pesoRiesgo = 0.35; pesoWacc = 0.35; pesoRoe = 0.3;
        }

        const escenariosPuntuados = arrEscenarios.map(e => {
            // Normalizamos de 0 a 100
            const nRoe = maxRoe === minRoe ? 100 : ((e.roe - minRoe) / (maxRoe - minRoe)) * 100;
            // Riesgo inverso (menor riesgo = mayor score)
            const nRiesgo = maxRiesgo === minRiesgo ? 100 : ((maxRiesgo - e.riesgo) / (maxRiesgo - minRiesgo)) * 100;
            // WACC inverso (menor WACC = mayor score)
            const nWacc = maxWacc === minWacc ? 100 : ((maxWacc - e.wacc) / (maxWacc - minWacc)) * 100;

            const score = (nRoe * pesoRoe) + (nRiesgo * pesoRiesgo) + (nWacc * pesoWacc);
            
            return { ...e, score };
        });

        // Ordenamos por Score
        escenariosPuntuados.sort((a, b) => b.score - a.score);
        setEscenarios(escenariosPuntuados);

                                                            <i className="ph ph-money text-red-500 text-xl mt-0.5"></i>
                                                            <div className="text-sm text-gray-700 leading-relaxed">
                                                                <strong className="text-gray-900 block mb-1">Alta carga de intereses</strong>
                                                                Salida de efectivo significativa que reduce la utilidad neta.
                                                                <span className="block mt-1 text-xs font-medium text-red-600 bg-red-50 p-1.5 rounded-lg border border-red-100">
                                                                    Ej: Gastos de US$ 11.53M (2024) y US$ 10.94M (2025).
                                                                </span>
                                                            </div>
                                                        </li>
                                                        <li className="flex items-start gap-3">
                                                            <i className="ph ph-warning-circle text-red-500 text-xl mt-0.5"></i>
                                                            <div className="text-sm text-gray-700 leading-relaxed">
                                                                <strong className="text-gray-900 block mb-1">Riesgo de liquidez y refinanciamiento</strong>
                                                                Líneas de crédito cancelables unilateralmente, obligando a un riguroso manejo de caja.
                                                            </div>
                                                        </li>
                                                        <li className="flex items-start gap-3">
                                                            <i className="ph ph-lock-key text-red-500 text-xl mt-0.5"></i>
                                                            <div className="text-sm text-gray-700 leading-relaxed">
                                                                <strong className="text-gray-900 block mb-1">Bloqueo de activos comerciales</strong>
                                                                Exige pignorar el producto, restringiendo su venta libre.
                                                                <span className="block mt-1 text-xs font-medium text-red-600 bg-red-50 p-1.5 rounded-lg border border-red-100">
                                                                    Ej: 47,368 TM (2024) y 28,160 TM (2025) inmovilizadas.
                                                                </span>
                                                            </div>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                    <div className="bg-gray-50 p-4 text-center border-t">
                                        <button onClick={() => setActiveModal(null)} className="px-6 py-2 bg-gray-800 text-white font-bold rounded-xl hover:bg-gray-700 transition-colors">
                                            Entendido
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const renderContent = () => {
                // Navegación de Información General
                if (activeSubMenu === 'info-datos') return <DatosEmpresaView />;
                if (activeSubMenu === 'info-mision') return <MisionVisionView />;
                if (activeSubMenu === 'info-financieros') return <FinancialStatementsView />;
                if (activeSubMenu && activeSubMenu.startsWith('liquidez-estado-')) return <SituacionInicialView activeSubMenu={activeSubMenu} />;
                if (activeSubMenu === 'liquidez-evolucion') return <EvolucionView />;
                if (activeSubMenu === 'liquidez-mercado-monetario') return <MercadoMonetarioView onNavigate={handleSubMenuClick} />;
                if (activeSubMenu === 'liquidez-simulador-tasas') return <SimuladorTasasView />;
                if (activeSubMenu === 'liquidez-mercado-capitales') return <MercadoCapitalesView />;
                if (activeSubMenu === 'liquidez-simulador-bonos') return <SimuladorBonosView />;
                if (activeSubMenu === 'liquidez-simulador-acciones') return <SimuladorAccionesView />;
                if (activeSubMenu === 'liquidez-escenarios') return <EscenariosView />;
                if (activeSubMenu === 'liquidez-estrategia') return <EstrategiaFinanciamientoView />;
                if (activeSubMenu === 'liquidez-wacc') return <WaccView />;

                // Matrices y Mapas dinámicos
                if (activeSubMenu && activeSubMenu.includes('matriz')) return <MatrixView activeMenu={activeMenu} />;
                if (activeSubMenu && activeSubMenu.includes('mapa')) return <HeatmapView activeMenu={activeMenu} />;

                // Conclusiones y Recomendaciones
                if (activeMenu === 'conclusiones') return <ConclusionesView />;
                if (activeMenu === 'recomendaciones') return <RecomendacionesView />;

                // Vistas generales
                if (expandedMenu && !activeSubMenu) {
                    const item = menuData.find(m => m.id === expandedMenu);
                    return (
                        <div className="flex flex-col items-center justify-center h-full text-center bg-white rounded-2xl shadow-xl p-8">
                            <h2 className="text-3xl font-bold text-exalmar-dark mb-4">Sección: {item.title}</h2>
                            <p className="text-lg text-gray-500 max-w-lg">
                                Por favor, seleccione una opción del submenú lateral para visualizar el detalle (Matriz o Mapa de calor).
                            </p>
                        </div>
                    );
                }

                // Vistas simples (Conclusiones, Recomendaciones)
                const currentItem = menuData.find(m => m.id === activeMenu);
                return (
                    <div className="flex items-center justify-center h-full bg-white rounded-2xl shadow-xl p-8">
                        <h2 className="text-4xl font-black text-exalmar-blue">{currentItem ? currentItem.title : 'Seleccione una opción'}</h2>
                    </div>
                );
            };

            if (!showDashboard) {
                return <CoverPage onEnter={() => setShowDashboard(true)} />;
            }

            return (\n                <SimulationProvider>
                <div className="flex w-full h-screen bg-gray-100 p-4 md:p-6 overflow-hidden animate-fade-in-up">
                    
                    {/* Sidebar */}
                    <div className="w-80 flex flex-col gap-3 mr-6 flex-shrink-0 bg-exalmar-blue rounded-2xl shadow-xl overflow-hidden flex flex-col">
                        <div className="p-6 bg-exalmar-dark border-b border-white/10 flex items-center justify-center">
                            <i className="ph ph-boat text-white text-3xl mr-3"></i>
                            <h2 className="text-white text-xl font-black tracking-widest">EXALMAR</h2>
                        </div>

                        <div className="overflow-y-auto flex-grow p-4 space-y-2">
                            {menuData.map((item) => (
                                <div key={item.id} className="flex flex-col">
                                    <button 
                                        onClick={() => handleMenuClick(item)}
                                        className={`
                                            w-full text-left px-5 py-4 rounded-xl font-bold text-sm uppercase tracking-wide transition-all flex items-center justify-between
                                            ${(expandedMenu === item.id || (!expandedMenu && activeMenu === item.id)) 
                                                ? 'bg-white text-exalmar-blue shadow-md' 
                                                : 'text-white/80 hover:bg-white/10 hover:text-white'}
                                        `}
                                    >
                                        <span>{item.title}</span>
                                        {item.type === 'expandable' && (
                                            <i className={`ph ph-caret-down transition-transform duration-300 ${expandedMenu === item.id ? 'rotate-180' : ''}`}></i>
                                        )}
                                    </button>
                                    
                                    {/* Submenú */}
                                    {item.type === 'expandable' && expandedMenu === item.id && (
                                        <div className="flex flex-col gap-1 pl-4 mt-2 mb-2 relative">
                                            <div className="absolute left-[26px] top-0 bottom-4 w-[2px] bg-white/20 rounded-full"></div>
                                            {item.subItems.map(sub => (
                                                <button 
                                                    key={sub.id}
                                                    onClick={() => handleSubMenuClick(sub.id, item.id)}
                                                    className={`
                                                        w-full text-left pl-10 pr-4 py-3 rounded-lg text-sm font-medium transition-all flex items-center gap-3 relative
                                                        ${activeSubMenu === sub.id 
                                                            ? 'bg-exalmar-accent text-white shadow' 
                                                            : 'text-white/70 hover:text-white hover:bg-white/5'}
                                                    `}
                                                >
                                                    {activeSubMenu === sub.id && (
                                                        <div className="absolute left-[8px] w-2 h-2 bg-white rounded-full shadow-[0_0_8px_white]"></div>
                                                    )}
                                                    
                                                    {sub.id.includes('datos') ? <i className="ph ph-buildings text-lg"></i>
                                                    : sub.id.includes('mision') ? <i className="ph ph-target text-lg"></i>
                                                    : sub.id.includes('financieros') ? <i className="ph ph-chart-line-up text-lg"></i>
                                                    : sub.id.includes('matriz') ? <i className="ph ph-table text-lg"></i> 
                                                    : sub.id.includes('mapa') ? <i className="ph ph-grid-four text-lg"></i>
                                                    : <i className="ph ph-file-text text-lg"></i>}
                                                    {sub.title}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-grow h-full relative">
                        {renderContent()}
                    </div>
                </div>
            );
                </SimulationProvider>\n            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
